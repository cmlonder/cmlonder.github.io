name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy; sıradakini iptal etme, sırayla çalışsınlar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm sürümü package.json'daki packageManager alanından okunur.
      # Burada da belirtmek "Multiple versions of pnpm specified" hatası verir.
      - uses: withastro/action@v6
        with:
          node-version: 22

      # Kırık iç link veya başlık atlaması varsa deploy etme.
      - name: Build doğrulaması
        run: node scripts/check-build.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
