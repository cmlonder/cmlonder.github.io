name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # radar.yml buradan çağırır (bot push'u kendi başına deploy tetiklemiyor)
  workflow_call:
    inputs:
      ref:
        description: Build edilecek ref. Boşsa tetikleyen commit kullanılır.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy; sıradakini iptal etme, sırayla çalışsınlar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # radar.yml çağırdığında bot'un yeni commit'i build edilmeli;
          # varsayılan davranış TETİKLEYEN commit'i alır ve bayat yayınlar.
          ref: ${{ inputs.ref || github.ref }}
      # pnpm sürümü package.json'daki packageManager alanından okunur.
      # Burada da belirtmek "Multiple versions of pnpm specified" hatası verir.
      - uses: withastro/action@v6
        with:
          node-version: 22

      # Tip hatası, kırık iç link veya başlık atlaması varsa deploy etme.
      - name: Tip kontrolü
        run: pnpm astro check

      - name: Build doğrulaması
        run: node scripts/check-build.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
