name: Radar

# Spark -> Google Doc -> (Apps Script) -> inbox/ -> burası -> site
# Zincirde insan yok. inbox'a düşen her dosya işlenir ve silinir.
on:
  push:
    paths: ['inbox/radar/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  isle:
    runs-on: ubuntu-latest
    outputs:
      degisti: ${{ steps.isle.outputs.degisti }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: isle
        name: Kuyruğu işle
        run: |
          set -euo pipefail
          # Spark yayına hazır markdown yazıyor. check-radar dönüştürmüyor,
          # sadece frontmatter'ın sağlam olduğunu doğrulayıp yerine taşıyor.
          node scripts/check-radar.mjs | tee /tmp/radar.log
          grep -q '^✓' /tmp/radar.log || { echo "degisti=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # Yayınlanabilir mi: build + tip + link kontrolü
          pnpm astro check
          pnpm build
          node scripts/check-build.mjs

          echo "degisti=true" >> "$GITHUB_OUTPUT"

      - name: Sonucu commit'le
        if: steps.isle.outputs.degisti == 'true'
        run: |
          git config user.name  "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/radar inbox
          git commit -m "Radar: yeni bülten yayınlandı

          Spark -> Drive -> inbox -> check-radar -> site.
          Otomatik; elle dokunulmadı."
          git push

  # GITHUB_TOKEN ile atılan push başka workflow tetiklemez (döngü koruması),
  # bu yüzden deploy'u buradan çağırıyoruz.
  yayinla:
    needs: isle
    if: needs.isle.outputs.degisti == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}   # bot commit'i push edildikten SONRA çekilir
    permissions:
      contents: read
      pages: write
      id-token: write
